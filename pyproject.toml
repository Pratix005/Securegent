[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Identity, permissions and audit for AI agents: a firewall between your agent and its tools."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Pratix005" }]
keywords = ["ai-agents", "security", "llm", "prompt-injection", "authorization", "audit", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []   # the core has no dependencies

[project.optional-dependencies]
claude = ["anthropic>=2.10.0"]

[tool.setuptools]
packages = ["agentguard"]
